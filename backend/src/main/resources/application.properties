server.port=8080

# Spring Data MongoDB Configuration using environment variables with fallback
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:aireadiness}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Secure Upload Settings
app.upload.max-file-size-mb=50
app.upload.max-extracted-size-mb=200
app.upload.max-entries-count=10000
app.upload.workspace-base-dir=target/workspaces
