server.port=8080

# Spring Data MongoDB Configuration using environment variables with fallback
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:aireadiness}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
# Secure Upload Settings
app.upload.max-file-size-mb=50
app.upload.max-extracted-size-mb=200
app.upload.max-entries-count=10000
app.upload.workspace-base-dir=target/workspaces

# OpenAI Embedding Configuration
openai.api-key=${OPENAI_API_KEY:}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding.endpoint=${OPENAI_EMBEDDING_ENDPOINT:https://api.openai.com/v1/embeddings}
openai.embedding.timeout-ms=${OPENAI_EMBEDDING_TIMEOUT_MS:5000}
openai.embedding.dimension=${OPENAI_EMBEDDING_DIMENSION:1536}

# RAG Retrieval Configuration
rag.retrieval.default-top-k=5
rag.retrieval.max-top-k=20

# OpenAI LLM Configuration
openai.llm.model=${OPENAI_LLM_MODEL:gpt-4o-mini}
openai.llm.endpoint=${OPENAI_LLM_ENDPOINT:https://api.openai.com/v1/chat/completions}
openai.llm.timeout-ms=${OPENAI_LLM_TIMEOUT_MS:15000}
openai.llm.max-retries=${OPENAI_LLM_MAX_RETRIES:2}

